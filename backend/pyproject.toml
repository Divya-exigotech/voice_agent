[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF", "PT", "T20", "DTZ",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]  # the CLI harness prints to the developer's own terminal

[tool.pytest.ini_options]
testpaths = ["tests"]
